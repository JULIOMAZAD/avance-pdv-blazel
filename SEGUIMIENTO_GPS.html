<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento GPS — JMD Gerencia</title>
<style>
  :root{
    --rojo:#E4002B; --rojo-oscuro:#A5001F; --tinta:#1B1B1F; --gris:#6B6B75;
    --gris-claro:#F1F1F4; --verde:#1E8E5A; --ambar:#B7791F; --borde:#E3E3E8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--gris-claro);color:var(--tinta);padding:28px 20px 60px;}
  .wrap{max-width:1100px;margin:0 auto;}
  .marca{display:flex;align-items:baseline;gap:2px;}
  .marca .b{font-weight:800;font-size:20px;}
  .marca .l{font-weight:800;font-size:20px;color:var(--rojo);}
  .subtitulo{color:var(--gris);font-size:13px;margin-bottom:20px;}
  .fila-tarjetas{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;align-items:stretch;}
  .tarjeta-control{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px 18px;flex:1 1 300px;min-width:280px;}
  .tarjeta-control label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);}
  .tarjeta-control input[type=date],.tarjeta-control input[type=text],.tarjeta-control select{
    padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:14px;background:#fff;
    margin:6px 8px 6px 0;
  }
  .tarjeta-control select{min-width:220px;}
  .tarjeta-control input[type=text]{min-width:220px;}
  button.recargar{padding:10px 16px;border:none;border-radius:10px;background:var(--tinta);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  button.recargar.rojo{background:var(--rojo);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .kpi{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px 16px;}
  .kpi .n{font-size:26px;font-weight:800;}
  .kpi .t{font-size:12px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .kpi.ok .n{color:var(--verde);}
  .kpi.falta .n{color:var(--rojo);}
  .kpi.descanso .n{color:var(--ambar);}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  th,td{padding:11px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--borde);}
  th{background:var(--tinta);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .pill.ok{background:#E9F7EF;color:var(--verde);}
  .pill.falta{background:#FDEAEA;color:var(--rojo-oscuro);}
  .pill.descanso{background:#FDF3E3;color:var(--ambar);}
  .pill.sinmarcar{background:var(--gris-claro);color:var(--gris);}
  .pill.renuncio{background:#EDEDF2;color:var(--gris);text-decoration:line-through;}
  .muted{color:var(--gris);}
  .estado-carga{padding:40px;text-align:center;color:var(--gris);}
</style>
</head>
<body>
<div class="wrap">
  <div class="marca"><span class="b">JMD-GERENCIA</span><span class="l">•SEGUIMIENTO GPS</span></div>
  <div class="subtitulo">Asistencia de campo por día — entrada, salida, horas y ubicación</div>

  <div class="fila-tarjetas">
    <div class="tarjeta-control">
      <label for="fecha">Fecha</label><br>
      <input type="date" id="fecha">
      <button class="recargar" onclick="cargarTodo()">🔄 Actualizar</button>
      <div id="ultimaActualizacion" class="muted" style="font-size:12px;margin-top:8px"></div>
    </div>
    <div class="tarjeta-control" id="tarjetaBaja">
      <label>Dar de baja a un asesor</label><br>
      <select id="bajaNombre">
        <option value="">Selecciona un asesor…</option>
      </select>
      <input type="date" id="bajaFecha" title="Fecha de renuncia/retiro">
      <input type="text" id="bajaMotivo" placeholder="Motivo (ej. Renunció, Retirado por bajo rendimiento)">
      <button class="recargar rojo" onclick="darDeBaja()">🚫 Dar de baja</button>
      <div id="bajaEstado" class="muted" style="font-size:12px;margin-top:8px"></div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi ok"><div class="n" id="kpiAsistio">–</div><div class="t">Asistieron</div></div>
    <div class="kpi falta"><div class="n" id="kpiFalto">–</div><div class="t">Faltaron</div></div>
    <div class="kpi descanso"><div class="n" id="kpiDescanso">–</div><div class="t">Descanso</div></div>
    <div class="kpi"><div class="n" id="kpiTotal">–</div><div class="t">Total asesores</div></div>
  </div>

  <div id="contenedorTabla">
    <div class="estado-carga">Cargando...</div>
  </div>

  <div class="subtitulo" style="margin-top:32px;font-weight:700;color:var(--tinta);font-size:15px">Acumulado del mes</div>
  <div id="contenedorResumen">
    <div class="estado-carga">Cargando...</div>
  </div>
</div>

<script>
  // ======================================================================
  // Links CSV publicados desde Google Sheets (Archivo > Compartir >
  // Publicar en la web). Si cambias de hoja de Google Sheets cada mes,
  // actualiza estos dos links.
  // ======================================================================
  const CSV_DATOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvGCLp7WH54-iCTYZSTI_PpYeRAoey4Ov__FUGWEfTZNB0n-PPwCDVV0G6gUjSkiz8y_haVHkEKVXy/pub?gid=65768257&single=true&output=csv";
  const CSV_MARCACIONES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvGCLp7WH54-iCTYZSTI_PpYeRAoey4Ov__FUGWEfTZNB0n-PPwCDVV0G6gUjSkiz8y_haVHkEKVXy/pub?gid=1159119613&single=true&output=csv";

  // Mismo Apps Script que usa la pantalla de marcado — sirve tanto
  // para registrar entradas/salidas como para dar de baja asesores.
  const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw125n4ceKoQwUBq8zRHKeGzHue_EzZj8yd1zYt_xym0BUbiOgnr5rJFtLuapDJA3kfsA/exec";

  // Lista de asesores de campo que sigue este panel (mismo orden/nombres
  // que en el mapa del Apps Script). Para agregar uno nuevo, añade su
  // nombre EXACTO aquí.
  const ASESORES = [
    "ANGELA ROJAS BOBBIO","CAMILO RIVERA","JESUS CRUZ ACUÑA",
    "ALBERTO ROJAS MENDOZA","CECILIA PUNTAS SALCEDO","GRACIE ARACELI MANRIQUE MORQUENCHO",
    "RUTH SARAI VERGARA SANCHEZ","ANGELY JARITZA ALEGRÍA ZAMBRANO","JAVIER CASTELO JESÚS",
    "BRENNA JOSSARY SALAS SHAPIAMA","LUIS FERNANDO ROSADO","RIGOBERTO JUNIOR TERRANOVA GARCIA"
  ];

  // Se llena solo al cargar, leyendo la hoja INACTIVOS a través del
  // Apps Script — ya no hace falta editar código para dar de baja a
  // alguien, se hace desde el formulario de arriba.
  let INACTIVOS = {};

  document.getElementById('bajaNombre').innerHTML = '<option value="">Selecciona un asesor…</option>' +
    ASESORES.map(n => '<option value="' + n + '">' + n + '</option>').join('');

  // Solo jmaza puede dar de baja asesores. Amparo y Gracie solo ven
  // el seguimiento, no esta tarjeta.
  const parametros = new URLSearchParams(window.location.search);
  const usuarioActual = parametros.get('u') || '';
  if (usuarioActual !== 'jmaza') {
    document.getElementById('tarjetaBaja').style.display = 'none';
  }

  async function darDeBaja(){
    const nombre = document.getElementById('bajaNombre').value;
    const fecha = document.getElementById('bajaFecha').value || hoyISO();
    const motivo = document.getElementById('bajaMotivo').value.trim();
    const estado = document.getElementById('bajaEstado');
    if (!nombre || !motivo){
      estado.textContent = 'Selecciona el asesor y escribe un motivo.';
      return;
    }
    estado.textContent = 'Guardando…';
    try {
      await fetch(URL_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'inactivar', nombre: nombre, motivo: motivo, fecha: fecha })
      });
      // Actualización optimista: lo reflejamos ya mismo en el panel,
      // sin esperar a que vuelva a llegar del servidor.
      INACTIVOS[nombre] = { fecha: fecha, motivo: motivo };
      estado.textContent = nombre + ' dado de baja desde el ' + fecha + '.';
      document.getElementById('bajaNombre').value = '';
      document.getElementById('bajaFecha').value = '';
      document.getElementById('bajaMotivo').value = '';
      renderTabla();
      renderResumen();
    } catch (err) {
      estado.textContent = 'No se pudo guardar, intenta de nuevo.';
    }
  }

  function hoyISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  document.getElementById('fecha').value = hoyISO();

  // Parser CSV simple (soporta comillas)
  function parseCSV(texto){
    const filas = [];
    let fila = [], campo = '', enComillas = false;
    for (let i = 0; i < texto.length; i++){
      const c = texto[i];
      if (enComillas){
        if (c === '"'){
          if (texto[i+1] === '"'){ campo += '"'; i++; } else { enComillas = false; }
        } else { campo += c; }
      } else {
        if (c === '"'){ enComillas = true; }
        else if (c === ','){ fila.push(campo); campo = ''; }
        else if (c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo=''; }
        else if (c === '\r'){ /* ignorar */ }
        else { campo += c; }
      }
    }
    if (campo !== '' || fila.length){ fila.push(campo); filas.push(fila); }
    return filas;
  }

  async function obtenerCSV(url){
    const resp = await fetch(url + '&_=' + Date.now());
    const texto = await resp.text();
    return parseCSV(texto);
  }

  function estadoDesdeCodigo(codigo){
    if (codigo === '1') return {clase:'ok', texto:'✔ Asistió'};
    if (codigo === '2') return {clase:'falta', texto:'✕ Faltó'};
    if (codigo === '3') return {clase:'descanso', texto:'● Descanso'};
    return {clase:'sinmarcar', texto:'— Sin dato'};
  }

  function coincideFecha(texto, dia, mes, anio){
    if (!texto) return false;
    const partes = texto.trim().split(/[\/\-]/).map(Number);
    if (partes.length < 3 || partes.some(isNaN)) return false;
    return partes[0] === dia && partes[1] === mes && partes[2] === anio;
  }

  function horaTextoASegundos(texto){
    if (!texto) return null;
    const partes = texto.trim().split(':').map(Number);
    if (partes.length < 2 || partes.some(isNaN)) return null;
    const [hh, mm, ss] = [partes[0]||0, partes[1]||0, partes[2]||0];
    return hh*3600 + mm*60 + ss;
  }

  function segundosATexto(seg){
    if (seg === null || isNaN(seg)) return '—';
    const hh = Math.floor(seg/3600).toString().padStart(2,'0');
    const mm = Math.floor((seg%3600)/60).toString().padStart(2,'0');
    return hh + ':' + mm;
  }

  let ultimaFechaISO = hoyISO();
  let ultimoCodigoPorNombre = {};
  let ultimasMarcasPorNombre = {};
  let ultimoResumenPorNombre = {};

  function renderResumen(){
    let filas = '';
    ASESORES.forEach(nombre => {
      const info = INACTIVOS[nombre];
      if (info && ultimaFechaISO >= info.fecha){
        filas += '<tr><td>' + nombre + '</td><td colspan="3" class="muted">' + info.motivo + ' desde el ' + info.fecha + '</td></tr>';
        return;
      }
      const c = ultimoResumenPorNombre[nombre] || { asistio:0, falto:0, descanso:0 };
      filas += '<tr>' +
        '<td>' + nombre + '</td>' +
        '<td><span class="pill ok">' + c.asistio + '</span></td>' +
        '<td><span class="pill falta">' + c.falto + '</span></td>' +
        '<td><span class="pill descanso">' + c.descanso + '</span></td>' +
      '</tr>';
    });
    document.getElementById('contenedorResumen').innerHTML =
      '<table><thead><tr><th>Asesor</th><th>Asistencias</th><th>Faltas</th><th>Descansos</th></tr></thead><tbody>' + filas + '</tbody></table>';
  }

  async function cargarTodo(){
    document.getElementById('contenedorTabla').innerHTML = '<div class="estado-carga">Cargando...</div>';
    try {
      const fechaISO = document.getElementById('fecha').value; // yyyy-mm-dd
      ultimaFechaISO = fechaISO;
      const [anio, mes, dia] = fechaISO.split('-').map(Number);
      const fechaDDMMYYYY = String(dia).padStart(2,'0') + '/' + String(mes).padStart(2,'0') + '/' + anio;

      const [datosFilas, marcFilas] = await Promise.all([obtenerCSV(CSV_DATOS), obtenerCSV(CSV_MARCACIONES)]);

      try {
        const controlador = new AbortController();
        const limite = setTimeout(() => controlador.abort(), 4000);
        const respInact = await fetch(URL_SCRIPT, { signal: controlador.signal });
        clearTimeout(limite);
        const dataInact = await respInact.json();
        if (dataInact && dataInact.inactivos) INACTIVOS = dataInact.inactivos;
      } catch (errInact) {
        // Si no se puede leer a tiempo (CORS, red, demora, etc.), seguimos
        // con la lista que ya teníamos en memoria en vez de trabar el panel.
      }

      // ---- Ubicar columna del día en DATOS ----
      let filaHeader = datosFilas.findIndex(f => f[0] && f[0].trim() === 'N°');
      let colDia = -1;
      if (filaHeader !== -1){
        const header = datosFilas[filaHeader];
        for (let c = 2; c < header.length; c++){
          const partes = (header[c]||'').split('/');
          if (partes.length >= 2 && parseInt(partes[0],10) === dia){ colDia = c; break; }
        }
      }

      const codigoPorNombre = {};
      if (filaHeader !== -1 && colDia !== -1){
        for (let r = filaHeader+1; r < datosFilas.length; r++){
          const nombre = (datosFilas[r][1]||'').trim();
          if (!nombre) continue;
          codigoPorNombre[nombre] = (datosFilas[r][colDia]||'').trim();
        }
      }

      // ---- Marcaciones del día por nombre ----
      let mHeader = marcFilas.findIndex(f => f[0] && f[0].trim() === 'Fecha');
      const marcasPorNombre = {};
      if (mHeader !== -1){
        for (let r = mHeader+1; r < marcFilas.length; r++){
          const fila = marcFilas[r];
          if (!fila[0]) continue;
          if (!coincideFecha(fila[0], dia, mes, anio)) continue;
          const nombre = (fila[2]||'').trim();
          if (!marcasPorNombre[nombre]) marcasPorNombre[nombre] = { entrada:null, salida:null, distrito:'—', horasTrab:null, horasFalt:null, latEntrada:null, lngEntrada:null, latSalida:null, lngSalida:null };
          const tipo = (fila[3]||'').trim();
          const horaSeg = horaTextoASegundos(fila[1]);
          if (tipo === 'ENTRADA'){
            if (marcasPorNombre[nombre].entrada === null || horaSeg < marcasPorNombre[nombre].entrada){
              marcasPorNombre[nombre].entrada = horaSeg;
              marcasPorNombre[nombre].latEntrada = fila[4];
              marcasPorNombre[nombre].lngEntrada = fila[5];
            }
          }
          if (tipo === 'SALIDA'){
            if (marcasPorNombre[nombre].salida === null || horaSeg > marcasPorNombre[nombre].salida){
              marcasPorNombre[nombre].salida = horaSeg;
              marcasPorNombre[nombre].latSalida = fila[4];
              marcasPorNombre[nombre].lngSalida = fila[5];
            }
            if (fila[8]) marcasPorNombre[nombre].horasTrab = fila[8];
            if (fila[9]) marcasPorNombre[nombre].horasFalt = fila[9];
          }
          if (fila[7]) marcasPorNombre[nombre].distrito = fila[7];
        }
      }

      // ---- Acumulado del mes: cuenta 1/2/3 en todas las columnas de día ----
      const resumenPorNombre = {};
      if (filaHeader !== -1){
        const header = datosFilas[filaHeader];
        for (let r = filaHeader+1; r < datosFilas.length; r++){
          const nombre = (datosFilas[r][1]||'').trim();
          if (!nombre) continue;
          const conteo = { asistio:0, falto:0, descanso:0 };
          for (let c = 2; c < header.length; c++){
            const partes = (header[c]||'').split('/');
            if (partes.length < 2) continue;
            const v = (datosFilas[r][c]||'').trim();
            if (v === '1') conteo.asistio++;
            else if (v === '2') conteo.falto++;
            else if (v === '3') conteo.descanso++;
          }
          resumenPorNombre[nombre] = conteo;
        }
      }

      ultimoCodigoPorNombre = codigoPorNombre;
      ultimasMarcasPorNombre = marcasPorNombre;
      ultimoResumenPorNombre = resumenPorNombre;
      renderTabla();
      renderResumen();
      document.getElementById('ultimaActualizacion').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-PE');

    } catch (err) {
      document.getElementById('contenedorTabla').innerHTML = '<div class="estado-carga">No se pudo cargar la información. Revisa que los links CSV sigan publicados. (' + err.message + ')</div>';
    }
  }

  function enlaceMapa(lat, lng){
    if (!lat || !lng) return '';
    return '<a href="https://www.google.com/maps?q=' + lat + ',' + lng + '" target="_blank" style="color:var(--rojo);font-weight:700;text-decoration:none">📍 Ver mapa</a>';
  }

  function renderTabla(){
    const fechaISO = ultimaFechaISO;
    const codigoPorNombre = ultimoCodigoPorNombre;
    const marcasPorNombre = ultimasMarcasPorNombre;

    let asistio=0, falto=0, descanso=0;
    let filasHtml = '';
    ASESORES.forEach(nombre => {
      // Solo se muestra como inactivo si la fecha consultada es igual
      // o posterior a su fecha de baja. Si consultas un día ANTERIOR
      // a su renuncia, se muestra su asistencia real de ese día.
      const info = INACTIVOS[nombre];
      if (info && fechaISO >= info.fecha) {
        filasHtml += '<tr>' +
          '<td>' + nombre + '</td>' +
          '<td><span class="pill renuncio">' + info.motivo + '</span></td>' +
          '<td colspan="7" class="muted">Desde el ' + info.fecha + '</td>' +
        '</tr>';
        return;
      }
      const codigo = codigoPorNombre[nombre] || '';
      const estado = estadoDesdeCodigo(codigo);
      if (estado.clase === 'ok') asistio++;
      else if (estado.clase === 'falta') falto++;
      else if (estado.clase === 'descanso') descanso++;

      const m = marcasPorNombre[nombre] || {};
      const mapaEntrada = enlaceMapa(m.latEntrada, m.lngEntrada) || '—';
      const mapaSalida = enlaceMapa(m.latSalida, m.lngSalida) || '—';

      filasHtml += '<tr>' +
        '<td>' + nombre + '</td>' +
        '<td><span class="pill ' + estado.clase + '">' + estado.texto + '</span></td>' +
        '<td>' + (m.entrada !== undefined && m.entrada !== null ? segundosATexto(m.entrada) : '—') + '</td>' +
        '<td>' + mapaEntrada + '</td>' +
        '<td>' + (m.salida !== undefined && m.salida !== null ? segundosATexto(m.salida) : '—') + '</td>' +
        '<td>' + mapaSalida + '</td>' +
        '<td>' + (m.horasTrab ? m.horasTrab + ' h' : '—') + '</td>' +
        '<td>' + (m.horasFalt ? m.horasFalt + ' h' : '—') + '</td>' +
        '<td class="muted">' + (m.distrito || '—') + '</td>' +
      '</tr>';
    });

    document.getElementById('kpiAsistio').textContent = asistio;
    document.getElementById('kpiFalto').textContent = falto;
    document.getElementById('kpiDescanso').textContent = descanso;
    document.getElementById('kpiTotal').textContent = ASESORES.length;

    document.getElementById('contenedorTabla').innerHTML =
      '<table><thead><tr>' +
      '<th>Asesor</th><th>Estado</th><th>Entrada</th><th>Ubicación entrada</th><th>Salida</th><th>Ubicación salida</th><th>Horas trabajadas</th><th>Horas faltantes</th><th>Distrito</th>' +
      '</tr></thead><tbody>' + filasHtml + '</tbody></table>';
  }

  cargarTodo();
</script>
</body>
</html>
