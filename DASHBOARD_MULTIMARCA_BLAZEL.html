<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTIMARCA BLAZEL · Tablero de Control</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#D81F26; --rojo2:#B5151B; --negro:#1B1B1F; --gris:#8E939B; --grisC:#D9DCE1;
  --paper:#F6F6F8; --card:#FFFFFF; --ink:#1B1B1F; --ink2:#6B7077; --line:#ECEDF0;
  --verde:#13A05F; --ambar:#E6A817;
  --sombra:0 2px 12px rgba(20,20,30,.06);
  --verde-bg:#E6F6EE; --ambar-bg:#FBF3DC; --rojo-bg:#FCE9E8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--negro);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:62px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:baseline;gap:8px}
.logo .b{font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.5px}
.logo .r{color:var(--rojo)}
.logo .sub{font-size:11px;color:#9AA3B0;letter-spacing:1.5px;text-transform:uppercase}
.spacer{flex:1}
#fechaData{font-size:11px;color:#9AA3B0;white-space:nowrap}

nav{background:#26262C;display:flex;overflow-x:auto;padding:0 12px;position:sticky;top:62px;z-index:49}
nav button{background:none;border:none;color:#B6BEC9;padding:13px 18px 10px;font-family:'Barlow Condensed';font-weight:600;font-size:16px;letter-spacing:1px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-transform:uppercase}
nav button.on{color:#fff;border-color:var(--rojo)}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.tab{display:none}.tab.on{display:block}

.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(205px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sombra)}

.kpi{display:flex;gap:12px;align-items:flex-start}
.chip{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip svg{width:20px;height:20px;fill:#fff}
.ch-rojo{background:var(--rojo)} .ch-negro{background:var(--negro)} .ch-gris{background:var(--gris)} .ch-verde{background:var(--verde)}
.kpi .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2);font-weight:700}
.kpi .val{font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1.05;margin-top:2px}
.kpi .val small{font-size:16px;color:var(--ink2);font-weight:600}
.vs{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:12px;padding:2px 8px;margin-top:6px}
.vs.up{background:var(--verde-bg);color:var(--verde)}
.vs.dn{background:var(--rojo-bg);color:var(--rojo)}
.vs.eq{background:#DCDFE5;color:#33333B}

h2{font-family:'Barlow Condensed';font-weight:600;font-size:20px;letter-spacing:.5px;text-transform:uppercase;margin:18px 0 10px;color:var(--ink);border-left:4px solid var(--rojo);padding-left:10px}
h2 .tag{font-size:12px;color:var(--ink2);font-family:'Inter';font-weight:500;text-transform:none;letter-spacing:0}

.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--sombra)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--negro);color:#fff;text-align:right;padding:10px 12px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 12px;border-bottom:1px solid #F0F2F4;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.tot td{font-weight:700;background:#FAFAFB;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:3px 10px;border-radius:14px;font-weight:700;font-size:12px}
.pv{background:var(--verde-bg);color:var(--verde)}
.pr{background:var(--rojo-bg);color:var(--rojo)}
.pn{background:#DCDFE5;color:#33333B}

.cmpTable th, .cmpTable td{text-align:center}
.cmpTable th:first-child, .cmpTable td:first-child{text-align:left}
.cmpTable .grpHead{border-radius:10px 10px 0 0;padding:9px 10px}
.cmpTable .g-pre{background:#3B4252;color:#fff}
.cmpTable .g-post{background:#B5302E;color:#fff}
.cmpTable .g-tot{background:#1F8A55;color:#fff}
.cmpTable td.b-start{border-left:2px solid var(--line)}
.cmpTable td.b-tint-pre{background:#EEF1F6}
.cmpTable td.b-tint-post{background:#FBEAE9}
.cmpTable td.b-tint-tot{background:#E7F6ED}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sombra)}

.distTable th{text-align:center}
.distTable th:first-child, .distTable td:first-child{text-align:left}
.distTable th:nth-child(2), .distTable td:nth-child(2){text-align:left}
.distTable .grpHead{border-radius:0;padding:8px 10px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}
.distTable .g-pre{background:#3B4252;color:#fff}
.distTable .g-post{background:#B5302E;color:#fff}
.distTable td.b-start{border-left:2px solid var(--line)}
.mCell{display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
.mCell .mNum{font-weight:700;font-variant-numeric:tabular-nums}
.mCell .mSub{font-size:10.5px;color:var(--ink2)}
.mCell .mTrack{width:100%;height:5px;background:var(--grisC);border-radius:3px;overflow:hidden}
.mCell .mFill{height:100%;border-radius:3px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:820px){ .grid4{grid-template-columns:1fr} }
.segRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.segBtn{padding:9px 18px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink2);transition:.15s}
.segBtn:hover{border-color:#1B1B1F;color:#1B1B1F}
.segBtn.on{background:#1B1B1F;color:#fff;border-color:#1B1B1F}
.chartbox .ch{position:relative;height:300px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--negro);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;display:none;z-index:101;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.note{font-size:12px;color:var(--ink2);margin:8px 2px}
.vcbody{display:none;overflow:hidden}
.vcbody.on{display:block}
.vHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;cursor:pointer}
.vHead:hover .vChev{color:var(--rojo)}
.vChev{color:var(--ink2);font-size:18px;transition:.15s}
.vStat{text-align:right;min-width:96px}
.vStat.vStatWide{min-width:150px}
.vStatLbl{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.vStatNum{font-weight:700;font-size:15px;margin:2px 0;font-variant-numeric:tabular-nums}
.vMiniNum{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:center}
.vMiniLbl{font-size:9px;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;text-align:center;margin-top:1px}
#loginOverlay{position:fixed;inset:0;background:#0E0F13;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px}
#loginOverlay .lcard{width:100%;max-width:380px;background:#1A1C22;border:1px solid #2E323C;border-radius:16px;padding:30px 28px}
#loginOverlay .lbrand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
#loginOverlay .lmark{width:42px;height:42px;border-radius:11px;background:var(--rojo);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
#loginOverlay h2{color:#fff;font-size:18px;text-align:center;margin:0 0 4px;font-family:'Inter'}
#loginOverlay p.s{color:#9AA0AA;font-size:13px;text-align:center;margin:0 0 20px}
#loginOverlay label{display:block;font-size:12px;color:#9AA0AA;margin:0 0 6px 2px}
#loginOverlay input{width:100%;background:#23262E;border:1px solid #2E323C;border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;margin-bottom:14px;outline:none;font-family:'Inter'}
#loginOverlay input:focus{border-color:var(--rojo)}
#loginOverlay button{width:100%;background:var(--rojo);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter'}
#loginOverlay .lerr{color:var(--rojo);font-size:13px;min-height:18px;margin-top:8px;text-align:center}
</style>
</head>

const MES_ABREV = {ENERO:'ENE',FEBRERO:'FEB',MARZO:'MAR',ABRIL:'ABR',MAYO:'MAY',JUNIO:'JUN',JULIO:'JUL',AGOSTO:'AGO',SEPTIEMBRE:'SET',SETIEMBRE:'SET',OCTUBRE:'OCT',NOVIEMBRE:'NOV',DICIEMBRE:'DIC'};
const MES_NUM = {ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,SETIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
const abrevMes = nombre => { if(!nombre) return ''; const m = String(nombre).trim().toUpperCase().match(/^([A-ZÑ]+)/); return m ? (MES_ABREV[m[1]]||m[1].slice(0,3)) : ''; };
const mesCodigo = nombre => {
  if(!nombre) return '';
  const s = String(nombre).trim().toUpperCase();
  const mm = s.match(/^([A-ZÑ]+)/), yy = s.match(/(\d{4})/);
  if(!mm||!yy||!MES_NUM[mm[1]]) return '';
  return yy[1]+'-'+String(MES_NUM[mm[1]]).padStart(2,'0');
};
/* Serie diaria (acumulada) de activación y capilaridad, a partir de DATA.ventasDiarias.
   filtroVendedor: null = todos los vendedores; o un nombre exacto de vendedor. */
function computeDiario(filtroVendedor){
  const dd = DATA.diaadia;
  const ventas = DATA.ventasDiarias||[];
  const codAct = mesCodigo(dd&&dd.mesActual), codAnt = mesCodigo(dd&&dd.mesAnterior);
  const corte = (dd&&dd.diaCorte) || 0;
  const dias = []; for(let d=1; d<=Math.max(corte,1); d++) dias.push(d);
  const vendMap = DATA.vendMap||{};
  const porDia = (codigo) => {
    const activPorDia = {}, dniActPorDia = {}; // {dia: count} , {dia: Set(dni)}
    ventas.forEach(v=>{
      if(!v.f || v.f.slice(0,7)!==codigo) return;
      if(filtroVendedor && (vendMap[v.d]||'BLAZEL')!==filtroVendedor) return;
      const d = parseInt(v.f.slice(8,10),10); if(!d) return;
      activPorDia[d] = (activPorDia[d]||0)+1;
      if(!dniActPorDia[d]) dniActPorDia[d] = new Set();
      if(v.d) dniActPorDia[d].add(v.d);
    });
    let acum=0; const acumSet = new Set();
    const serieDia=[], serieAcum=[], serieCapAcum=[];
    dias.forEach(d=>{
      const c = activPorDia[d]||0; acum+=c; serieDia.push(c); serieAcum.push(acum);
      if(dniActPorDia[d]) dniActPorDia[d].forEach(x=>acumSet.add(x));
      serieCapAcum.push(acumSet.size);
    });
    return {serieDia, serieAcum, serieCapAcum};
  };
  const act = codAct ? porDia(codAct) : {serieDia:dias.map(()=>0), serieAcum:dias.map(()=>0), serieCapAcum:dias.map(()=>0)};
  const ant = codAnt ? porDia(codAnt) : {serieDia:dias.map(()=>0), serieAcum:dias.map(()=>0), serieCapAcum:dias.map(()=>0)};
  return {dias, act, ant, tieneDatos: ventas.length>0 && !!codAct};
}
/* Índice DNI -> lista de ventas (perezoso, se recalcula solo si cambia DATA). */
function ventasByDni(){
  if(DATA._vbd) return DATA._vbd;
  const idx = {};
  (DATA.ventasDiarias||[]).forEach(v=>{ if(!v.d) return; (idx[v.d] || (idx[v.d]=[])).push(v); });
  DATA._vbd = idx;
  return idx;
}
/* Prepago/Postpago/Total de UN cliente (dni) en un día exacto del mes (1-31), para el mes actual
   y el mes anterior (según DATA.diaadia). Usado por el filtro "Día" de la cartera por vendedor. */
function diaClienteStats(dni, diaNum){
  const dd = DATA.diaadia;
  const codAct = mesCodigo(dd&&dd.mesActual), codAnt = mesCodigo(dd&&dd.mesAnterior);
  const arr = ventasByDni()[dni] || [];
  let pre_ant=0, post_ant=0, pre_act=0, post_act=0;
  arr.forEach(v=>{
    const cod = v.f.slice(0,7);
    if(cod!==codAct && cod!==codAnt) return;
    const day = parseInt(v.f.slice(8,10),10);
    if(day!==diaNum) return;
    const esPre = v.m!==2;
    if(cod===codAct){ if(esPre) pre_act++; else post_act++; }
    else { if(esPre) pre_ant++; else post_ant++; }
  });
  return {pre_ant,post_ant,pre_act,post_act,tot_ant:pre_ant+post_ant,tot_act:pre_act+post_act};
}

      for(let c=1; c<=12; c++){

        cell.border = { top:{style:'thin',color:{argb:'FFDDDDDD'}}, bottom:{style:'thin',color:{argb:'FFDDDDDD'}}, left:{style:'thin',color:{argb:'FFDDDDDD'}}, right:{style:'thin',color:{argb:'FFDDDDDD'}} };
        if(r>1 && c>3) cell.alignment = { horizontal:'center' };
      }
    }
    ws.views = [{ state:'frozen', xSplit:3, ySplit:1 }];
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const hoy = new Date().toISOString().slice(0,10);
    const nombreArchivo = String(v.vendedor||'vendedor').replace(/[^a-z0-9]+/gi,'_');
    a.href = url; a.download = `Cartera_${nombreArchivo}_${hoy}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ console.error('export cartera vendedor', e); alert('No se pudo generar el Excel. Revisa la consola (F12).'); }
  finally{ btn.textContent = txtOrig; btn.disabled = false; }
}

/* ================= MULTIMARCA (meta vs avance) ================= */
function rMultimarca(){
  const el = document.getElementById('tab-multimarca');
  const mm = DATA.multimarca;
  if(!mm || (!mm.indicadores.length && !mm.distritos.length)){
    el.innerHTML = `<h2>Multimarca</h2><div class="card">No se encontró la hoja CUOTA_MES en el archivo cargado.</div>`;
    return;
  }
  const tit = mm.titulo || 'Canal Multimarca';
  const sumaAva = {
    'Activacion Prepago': mm.distritos.reduce((s,d)=>s+(d.ava_pre||0),0),
    'Capilaridad Prepago': mm.distritos.reduce((s,d)=>s+(d.ava_cap_pre||0),0),
    'Activacion Postpago': mm.distritos.reduce((s,d)=>s+(d.ava_chip_post||0),0),
    'Capilaridad Postpago': mm.distritos.reduce((s,d)=>s+(d.ava_cap_post||0),0)
  };
  const avanceDe = nombre => {
    const k = Object.keys(sumaAva).find(x=>x.toUpperCase()===nombre.toUpperCase());
    return k ? sumaAva[k] : 0;
  };
  const hayAvance = mm.distritos.some(d=>d.ava_pre!=null||d.ava_cap_pre!=null||d.ava_chip_post!=null||d.ava_cap_post!=null);
  const chips = ['ch-rojo','ch-negro','ch-rojo','ch-negro'];
  const kpis = mm.indicadores.map((x,i)=>{
    const meta = x.cuota;
    const av = avanceDe(x.n);
    const p = meta ? av/meta : null;
    const pp = (x.proy!=null && meta) ? x.proy/meta : null;
    return `<div class="card kpi"><div class="chip ${chips[i%4]}">${ICO.rayo}</div><div>
      <div class="lbl">${x.n}</div>
      <div class="val num">${fN(av)} <small>/ ${fN(meta)}</small></div>
      <div class="vs ${p==null?'eq':p>=1?'up':'dn'}" style="${p==null?'':p>=1?'background:var(--verde-bg);color:var(--verde)':'background:var(--rojo-bg);color:var(--rojo)'}">${p==null?'—':fP(p)} de la meta</div>
      ${x.proy!=null?`<div style="margin-top:6px;font-size:11.5px;color:var(--ink2)">Proyección de cierre: <b class="num" style="color:${pp==null?'var(--ink2)':pp>=1?'var(--verde)':'var(--rojo)'}">${fN(x.proy)}</b>${pp!=null?' <span style="color:var(--ink2)">('+fP(pp)+' de la meta)</span>':''}</div>`:''}
    </div></div>`;
  }).join('');
  const diaAvHtml = window._diaAvanceMM
    ? `<span style="color:var(--ink2)">Día ${window._diaAvanceMM} <span style="color:var(--ink2);font-weight:400">(según la hoja COMPARATIVO_DIA_A_DIA del Excel)</span></span>`
    : `<span style="color:var(--ink2)">—</span>`;
  el.innerHTML = `
  <h2>${tit} <span class="tag">meta vs avance del canal multimarca</span></h2>
  <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <b>Día de avance:</b> ${diaAvHtml}
  </div>
  ${!hayAvance?'<div class="card" style="border-left:4px solid var(--ambar);margin-bottom:14px"><b>Avance aún en 0.</b> Llena las columnas de avance en CUOTA_MES conforme sumes activaciones y el % se calculará solo.</div>':''}
  <div class="grid kpis">${kpis}</div>
  <div class="chartbox"><div class="ch"><canvas id="chMM"></canvas></div></div>
  <p class="note" style="margin-top:14px">¿Quieres el detalle por distrito (meta, avance y lo que falta)? Está en la pestaña <a href="#" onclick="document.getElementById('navBtnCuotas').click();return false" style="color:var(--rojo);font-weight:700;text-decoration:none">Cuotas</a>.</p>`;
  mkChart('chMM',{type:'bar',data:{labels:mm.indicadores.map(x=>x.n),datasets:[
    {label:'Meta',data:mm.indicadores.map(x=>x.cuota),backgroundColor:'#D9DCE1',borderRadius:5,labelColor:'#6B7077'},
    {label:'Avance',data:mm.indicadores.map(x=>avanceDe(x.n)),backgroundColor:'#D81F26',borderRadius:5,labelColor:'#1B1B1F'}
  ]},options:{maintainAspectRatio:false,animation:false,layout:{padding:{top:18}},
    plugins:{legend:{position:'bottom'},barLabels:{on:true,fmt:'n'}},scales:{y:{grace:'10%'}}}});
}

/* ================= CUOTAS POR DISTRITO (detalle) ================= */
function rCuotas(){
  const el = document.getElementById('tab-cuotas');
  const mm = DATA.multimarca;
  if(!mm || !mm.distritos.length){
    el.innerHTML = `<h2>Cuotas por distrito</h2><div class="card">No se encontró la hoja CUOTA_MES en el archivo cargado.</div>`;
    return;
  }
  const faltaDe = (cuota,ava) => Math.max(0, (cuota||0) - (ava||0));
  const METRICAS = [
    {label:'Activación Prepago',  cuota:'chips_pre',  ava:'ava_pre',      proy:'proy_pre',      chip:'ch-rojo'},
    {label:'Activación Postpago', cuota:'chips_post', ava:'ava_chip_post',proy:'proy_post',      chip:'ch-negro'},
    {label:'Capilaridad Prepago', cuota:'cap_pre',     ava:'ava_cap_pre',  proy:'proy_cap_pre',  chip:'ch-rojo'},
    {label:'Capilaridad Postpago',cuota:'cap_post',    ava:'ava_cap_post', proy:'proy_cap_post', chip:'ch-negro'}
  ];
  const conDatos = d => {
    const m = METRICAS.map(mt=>{
      const cuota=d[mt.cuota], ava=d[mt.ava], proy=d[mt.proy];
      const p = (ava && cuota) ? ava/cuota : null;
      return {...mt, cuota, ava, proy, p, falta:faltaDe(cuota,ava)};
    });
    return {...d, m, falta_total: m.reduce((s,x)=>s+x.falta,0)};
  };
  const distritos = mm.distritos.map(conDatos);
  const totRec = mm.total ? conDatos(mm.total) : null;
  const subt = mm.titulo ? mm.titulo.replace('Canal Multimarca — ','') : '';

  el.innerHTML = `
  <h2>Cuotas por distrito <span class="tag">meta, avance y lo que falta${subt?' · '+subt:''}</span></h2>
  <div class="card" style="margin-bottom:14px">
    <label style="font-weight:600;display:block;margin-bottom:6px">Buscar distrito o responsable</label>
    <input id="cuBuscar" type="text" placeholder="Escribe para filtrar…" autocomplete="off"
      style="width:100%;max-width:440px;padding:11px 14px;border:1px solid #2c2e38;border-radius:10px;background:#1b1c22;color:#e8e8ea;font-size:15px;outline:none">
  </div>
  <div id="cuRes"></div>
  <p class="note" style="margin-top:10px">Toca un distrito para ver el detalle de cada métrica (meta, avance, proyección de cierre y lo que falta). Ordenado de mayor a menor pendiente. El TOTAL general queda siempre arriba.</p>`;

  const inp = document.getElementById('cuBuscar'), res = document.getElementById('cuRes');
  const pillFalta = falta => falta>0 ? `<span class="pill pr">Faltan ${fN(falta)}</span>` : `<span class="pill pv">✓ OK</span>`;
  const colorP = p => p==null ? 'var(--ink2)' : p>=1 ? 'var(--verde)' : p>=0.85 ? 'var(--ambar)' : 'var(--rojo)';
  const miniStat = x => `<div><div class="vMiniNum" style="color:${colorP(x.p)}">${x.p==null?'—':fP(x.p)}</div><div class="vMiniLbl">${x.label.replace('Activación','Act.').replace('Capilaridad','Cap.').replace(' Prepago',' Pre').replace(' Postpago',' Post')}</div></div>`;
  const kpiCard = x => `<div class="card kpi"><div class="chip ${x.chip}">${ICO.rayo}</div><div>
      <div class="lbl">${x.label}</div>
      <div class="val num">${fN(x.ava)} <small>/ ${fN(x.cuota)}</small></div>
      <div class="vs ${x.p==null?'eq':x.p>=1?'up':'dn'}" style="${x.p==null?'':x.p>=1?'background:var(--verde-bg);color:var(--verde)':'background:var(--rojo-bg);color:var(--rojo)'}">${x.p==null?'—':fP(x.p)} de la meta</div>
      ${x.proy!=null?`<div style="margin-top:6px;font-size:11.5px;color:var(--ink2)">Proyección de cierre: <b class="num" style="color:${colorP((x.proy!=null&&x.cuota)?x.proy/x.cuota:null)}">${fN(x.proy)}</b></div>`:''}
      <div style="margin-top:8px">${pillFalta(x.falta)}</div>
    </div></div>`;
  const bloqueDistrito = (d,i) => {
    const idc = 'cu'+i;
    return `<div class="card" style="margin-bottom:12px">
      <div class="vHead" data-idc="${idc}" onclick="toggleDistrito(this)">
        <div>
          <div style="font-family:'Barlow Condensed';font-weight:700;font-size:19px">${d.d}</div>
          <div style="color:var(--ink2);font-size:12px">${d.resp||''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <div class="vStat vStatWide">
            <div class="vStatLbl">% de la meta por métrica</div>
            <div style="display:flex;gap:14px;justify-content:flex-end;align-items:flex-end">${d.m.map(miniStat).join('')}</div>
          </div>
          <div class="vStat">
            <div class="vStatLbl">Pendiente</div>
            ${pillFalta(d.falta_total)}
          </div>
          <span class="vChev" id="${idc}chev">▾</span>
        </div>
      </div>
      <div id="${idc}" class="vcbody">
        <div class="grid kpis" style="margin-top:14px">${d.m.map(kpiCard).join('')}</div>
      </div>
    </div>`;
  };

  const pintar = q=>{
    q=(q||'').trim().toUpperCase();
    let lista = distritos;
    if(q){ lista = lista.filter(d=> (d.d||'').toUpperCase().includes(q) || (d.resp||'').toUpperCase().includes(q)); }
    lista = lista.slice().sort((a,b)=> b.falta_total - a.falta_total);
    const totCard = (!q && totRec) ? bloqueDistrito({...totRec, d:'TOTAL', resp:''}, 'tot') : '';
    if(!lista.length && !totCard){ res.innerHTML = `<div class="card">Sin resultados.</div>`; return; }
    res.innerHTML = totCard + lista.map(bloqueDistrito).join('');
  };
  inp.oninput = e=> pintar(e.target.value);
  pintar('');
}

    const txtOrig = btn.textContent; btn.textContent = 'Generando…'; btn.disabled = true;
    try{
      const PALETA_MES = ['FFD9EAD3','FFFCE5CD','FFCFE2F3','FFEAD1DC','FFD9D2E9','FFFFF2CC'];
      const COLOR_PROY = 'FFCFF3EA';
      const mesActual = ult3.length ? ult3[ult3.length-1] : null;

      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Comparativo Multimarca');

      const cols = [
        {header:'DNI', key:'dni', width:12},
        {header:'NOMBRE', key:'nombre', width:28},
        {header:'DISTRITO', key:'distrito', width:16},
        {header:'VENDEDOR', key:'vendedor', width:14},
      ];
      mesesDetectados.forEach(m=>{
        cols.push({header:`${cabMes(m)} Pre`, key:m+'_pre', width:10});
        cols.push({header:`${cabMes(m)} Post`, key:m+'_post', width:10});
        cols.push({header:`${cabMes(m)} Cap`, key:m+'_cap', width:9});
      });
      const hayProy = diaAv>0 && mesActual;
      if(hayProy){
        const lblMes = cabMes(mesActual);
        ['Prepago','Postpago'].forEach(prod=>{
          cols.push({header:`${prod} Diaria (${lblMes})`, key:prod.toLowerCase()+'_dia', width:16});
          cols.push({header:`${prod} Semanal (${lblMes})`, key:prod.toLowerCase()+'_sem', width:17});
          cols.push({header:`${prod} Mensual (${lblMes})`, key:prod.toLowerCase()+'_mes', width:17});
        });
      }
      ws.columns = cols;

      cp.forEach(c=>{
        const fila = { dni:c.dni, nombre:c.nombre||'', distrito:c.distrito||'', vendedor:c.vendedor||'' };
        mesesDetectados.forEach(m=>{
          const pre=getPre(c,m), post=getPost(c,m);
          fila[m+'_pre']=pre; fila[m+'_post']=post; fila[m+'_cap']=(pre+post)>0?1:0;
        });
        if(hayProy){
          const preAct=getPre(c,mesActual), postAct=getPost(c,mesActual);
          fila['prepago_dia']=Math.round(preAct/diaAv); fila['prepago_sem']=Math.round(preAct/diaAv*7); fila['prepago_mes']=proy(preAct);
          fila['postpago_dia']=Math.round(postAct/diaAv); fila['postpago_sem']=Math.round(postAct/diaAv*7); fila['postpago_mes']=proy(postAct);
        }
        ws.addRow(fila);
      });

      const headerRow = ws.getRow(1);
      headerRow.eachCell(cell=>{
        cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1B1B1F'} };
        cell.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
      });
      headerRow.height = 24;

      const colorPorColumna = {};
      mesesDetectados.forEach((m,i)=>{
        const color = PALETA_MES[i % PALETA_MES.length];
        [m+'_pre', m+'_post', m+'_cap'].forEach(k=> colorPorColumna[k]=color);
      });
      if(hayProy){ ['prepago_dia','prepago_sem','prepago_mes','postpago_dia','postpago_sem','postpago_mes'].forEach(k=> colorPorColumna[k]=COLOR_PROY); }

      ws.columns.forEach(col=>{
        const color = colorPorColumna[col.key];
        if(!color) return;
        for(let r=2; r<=ws.rowCount; r++){
          const cell = ws.getCell(r, col.number);
          cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:color} };
        }
      });

      if(hayProy){
        ['prepago_dia','prepago_sem','prepago_mes','postpago_dia','postpago_sem','postpago_mes'].forEach(key=>{
          const colNum = ws.getColumn(key).number;
          for(let r=2; r<=ws.rowCount; r++){
            const cell = ws.getCell(r, colNum);
            if(typeof cell.value === 'number' && cell.value < 0){
              cell.font = { color:{argb:'FFCC0000'}, bold:true };
            }
          }
        });
      }

      for(let r=1; r<=ws.rowCount; r++){
        for(let cIdx=1; cIdx<=cols.length; cIdx++){
          const cell = ws.getCell(r,cIdx);
          cell.border = { top:{style:'thin',color:{argb:'FFDDDDDD'}}, bottom:{style:'thin',color:{argb:'FFDDDDDD'}}, left:{style:'thin',color:{argb:'FFDDDDDD'}}, right:{style:'thin',color:{argb:'FFDDDDDD'}} };
          if(r>1 && cIdx>4) cell.alignment = { horizontal:'center' };
        }
      }
      ws.views = [{ state:'frozen', xSplit:4, ySplit:1 }];

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], {type:'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const hoy = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `Comparativo_Multimarca_Blazel_${hoy}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){ console.error('export comparativo', e); alert('No se pudo generar el Excel. Revisa la consola (F12).'); }
    finally{ btn.textContent = txtOrig; btn.disabled = false; }
  };
  const arrow=v=> v>0?`<span class="pill pv">+${fN(v)}</span>`: v<0?`<span class="pill pr">-${fN(-v)}</span>`:`<span class="pill pn">=</span>`;
  const cabMes = m=> m.slice(0,3).charAt(0).toUpperCase()+m.slice(1,3).toLowerCase();
  const ORDEN3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const diaAv = Number(window._diaAvanceMM) || 0;
  let diasDelMesActual = 0;
  if(diaAv > 0 && ult3.length){
    const idxMes = ORDEN3.indexOf(ult3[ult3.length-1].slice(0,3).toLowerCase());
    const anio = anioGlob || new Date().getFullYear();
    if(idxMes >= 0) diasDelMesActual = new Date(anio, idxMes+1, 0).getDate();
  }
  const proy = v => (diaAv>0 && diasDelMesActual>0) ? Math.round(v/diaAv*diasDelMesActual) : null;
  const fila = c=>{
    const pres = ult3.map(m=>getPre(c,m)), posts = ult3.map(m=>getPost(c,m));
    const tots = ult3.map((m,i)=>pres[i]+posts[i]);
    const dPre = pres.length>1 ? arrow(pres[pres.length-1]-pres[pres.length-2]) : '';
    const dPost = posts.length>1 ? arrow(posts[posts.length-1]-posts[posts.length-2]) : '';
    const dTot = tots.length>1 ? arrow(tots[tots.length-1]-tots[tots.length-2]) : '';
    return `<tr>
      <td><b>${c.nombre||'—'}</b><div style="color:var(--ink2);font-size:11px">DNI ${c.dni} · ${c.distrito||''}${c.vendedor?' · '+c.vendedor:''}</div></td>
      ${pres.map((v,i)=>`<td class="num b-tint-pre${i===0?' b-start':''}">${fN(v)}</td>`).join('')}<td class="num b-tint-pre">${dPre}</td>
      ${posts.map((v,i)=>`<td class="num b-tint-post${i===0?' b-start':''}">${fN(v)}</td>`).join('')}<td class="num b-tint-post">${dPost}</td>
      ${tots.map((v,i)=>`<td class="num b-tint-tot${i===0?' b-start':''}"><b>${fN(v)}</b></td>`).join('')}<td class="num b-tint-tot">${dTot}</td></tr>`;
  };
  const cajaProy = c=>{
    const pres = ult3.map(m=>getPre(c,m)), posts = ult3.map(m=>getPost(c,m));
    const valPre = pres[pres.length-1], valPost = posts[posts.length-1];
    const diaria  = v => (diaAv>0) ? Math.round(v/diaAv) : null;
    const semanal = v => (diaAv>0) ? Math.round(v/diaAv*7) : null;
    const mensual = v => proy(v);
    const bloque = (lbl, val, color) => {
      const d = diaria(val), s = semanal(val), m = mensual(val);
      const mini = (t,v)=> `<div style="flex:1;min-width:90px;text-align:center">
          <div style="font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--ink2)">${t}</div>
          <div style="font-size:22px;font-weight:800;margin-top:2px;color:${color}">${v==null?'—':fN(v)}</div>
        </div>`;
      return `<div style="flex:1;min-width:260px;background:${color}12;border:1px solid ${color}40;border-radius:12px;padding:12px 14px">
          <div style="font-size:12px;font-weight:800;letter-spacing:.04em;color:${color};margin-bottom:8px">${lbl}</div>
          <div style="display:flex;gap:6px">
            ${mini('DIARIA', d)}${mini('SEMANAL', s)}${mini('MENSUAL', m)}
          </div>
        </div>`;
    };
    const avisoDiaHtml = diaAv>0
      ? `<span style="display:inline-block;background:#FFF3CD;color:#8A6100;font-weight:800;font-size:13px;padding:4px 12px;border-radius:20px;margin-left:8px">AVANZA AL DÍA ${diaAv} DE ${diasDelMesActual}</span>`
      : `<span style="display:inline-block;background:#FDECEA;color:#B5302E;font-weight:800;font-size:13px;padding:4px 12px;border-radius:20px;margin-left:8px">FALTA EL DÍA DE AVANCE (hoja COMPARATIVO_DIA_A_DIA)</span>`;
    return `<div class="card" style="margin-top:10px;margin-bottom:14px">
      <div style="font-weight:700;margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;gap:4px">
        ${c.nombre||'—'} <span style="font-weight:400;color:var(--ink2);font-size:12px">· Proyección de cierre ${cabMes(ult3[ult3.length-1])}</span>${avisoDiaHtml}
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${bloque('PREPAGO', valPre, '#3B4252')}
        ${bloque('POSTPAGO', valPost, '#B5302E')}
      </div>
    </div>`;
  };
  const pintar = q=>{
    q=(q||'').trim().toUpperCase();
    if(!q){ res.innerHTML=`<div class="card">Escribe un <b>DNI</b> o un <b>nombre</b> arriba para ver su comparativo.</div>`; return; }
    const todas = cp.filter(c=> String(c.dni).toUpperCase().includes(q) || (c.nombre||'').toUpperCase().includes(q));
    if(!todas.length){ res.innerHTML=`<div class="card">Sin resultados para "${q}".</div>`; return; }
    const lista = todas.slice(0,50);
    const nCols = ult3.length;
    const avisoDia = diaAv>0 ? '' : `<p class="note">Para ver la proyección de cierre, agrega el <b>día de corte</b> en la hoja COMPARATIVO_DIA_A_DIA.</p>`;
    res.innerHTML = `<div class="twrap"><table class="cmpTable">
      <thead><tr><th rowspan="2" style="text-align:left">Cliente</th><th class="grpHead g-pre" colspan="${nCols+1}">Prepago</th><th class="grpHead g-post" colspan="${nCols+1}">Postpago</th><th class="grpHead g-tot" colspan="${nCols+1}">Total</th></tr>
      <tr>${ult3.map(cabMes).map((l,i)=>`<th class="${i===0?'b-start':''}">${l}</th>`).join('')}<th>Δ</th>${ult3.map(cabMes).map((l,i)=>`<th class="${i===0?'b-start':''}">${l}</th>`).join('')}<th>Δ</th>${ult3.map(cabMes).map((l,i)=>`<th class="${i===0?'b-start':''}">${l}</th>`).join('')}<th>Δ</th></tr></thead>
      <tbody>${lista.map(fila).join('')}</tbody></table></div>
      ${avisoDia}
      ${lista.map(cajaProy).join('')}
      ${todas.length>50?`<p class="note">Mostrando 50 de ${fN(todas.length)}. Afina la búsqueda.</p>`:''}`;
  };
  inp.oninput = e=> pintar(e.target.value);
  pintar('');
}

/* ================= COMPARATIVO DÍA A DÍA ================= */
function rDiaADia(){
  const el = document.getElementById('tab-diaadia');
  const dd = DATA.diaadia;
  if(!dd || !dd.puntos || !dd.puntos.length){
    el.innerHTML = `<h2>Comparativo día a día</h2><div class="card">No se encontró la hoja <b>COMPARATIVO_DIA_A_DIA</b> en el archivo cargado.</div>`;
    return;
  }
  const t = dd.puntos.reduce((s,p)=>({
    pre_ant:s.pre_ant+p.pre_ant, pre_act:s.pre_act+p.pre_act,
    post_ant:s.post_ant+p.post_ant, post_act:s.post_act+p.post_act,
    tot_ant:s.tot_ant+p.tot_ant, tot_act:s.tot_act+p.tot_act,
    cap_pre_ant: s.cap_pre_ant + (p.pre_ant>0?1:0), cap_pre_act: s.cap_pre_act + (p.pre_act>0?1:0),
    cap_post_ant: s.cap_post_ant + (p.post_ant>0?1:0), cap_post_act: s.cap_post_act + (p.post_act>0?1:0)
  }), {pre_ant:0,pre_act:0,post_ant:0,post_act:0,tot_ant:0,tot_act:0,cap_pre_ant:0,cap_pre_act:0,cap_post_ant:0,cap_post_act:0});
  const abAnt = abrevMes(dd.mesAnterior), abAct = abrevMes(dd.mesActual);
  const kpi = (lbl,ant,act,chipCls,ico)=>{
    const dif = act-ant; const p = ant? dif/ant : null;
    return `<div class="card kpi"><div class="chip ${chipCls}">${ico||ICO.rayo}</div><div>
      <div class="lbl">${lbl}</div>
      <div class="val num">${fN(act)} <small>vs ${fN(ant)}</small></div>
      <div class="vs ${dif===0?'eq':dif>0?'up':'dn'}" style="${dif===0?'':dif>0?'background:var(--verde-bg);color:var(--verde)':'background:var(--rojo-bg);color:var(--rojo)'}">${dif>0?'+':''}${fN(dif)}${p!=null?' ('+fP(p)+')':''}</div>
    </div></div>`;
  };
  const kpis = kpi('Prepago', t.pre_ant, t.pre_act, 'ch-rojo')
    + kpi('Postpago', t.post_ant, t.post_act, 'ch-negro')
    + kpi('Total', t.tot_ant, t.tot_act, 'ch-verde')
    + kpi('Capilaridad Prepago', t.cap_pre_ant, t.cap_pre_act, 'ch-rojo')
    + kpi('Capilaridad Postpago', t.cap_post_ant, t.cap_post_act, 'ch-negro');
  el.innerHTML = `
  <h2>Comparativo día a día <span class="tag">${dd.mesActual||''}${dd.diaCorte?' (al día '+dd.diaCorte+')':''}${dd.mesAnterior?' vs '+dd.mesAnterior+' (mismo día)':''}</span></h2>
  <div class="grid kpis" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${kpis}</div>
  <p class="note">Capilaridad = cantidad de puntos con venta mayor a 0 en el periodo (no el volumen, sino cuántos puntos distintos vendieron).</p>
  <h2>Evolución diaria <span class="tag">acumulado por día, todos los vendedores</span></h2>
  <div id="ddDiario"></div>
  <h2 style="margin-top:26px">Buscar un punto</h2>
  <div class="card" style="margin:14px 0">
    <label style="font-weight:600;display:block;margin-bottom:6px">Buscar por DNI, nombre, distrito o vendedor</label>
    <input id="ddBuscar" type="text" placeholder="Escribe para filtrar…" autocomplete="off"
      style="width:100%;max-width:440px;padding:11px 14px;border:1px solid #2c2e38;border-radius:10px;background:#1b1c22;color:#e8e8ea;font-size:15px;outline:none">
  </div>
  <div id="ddRes"></div>`;
  renderDiarioBlock('ddDiario', 'chDiarioGlobal', null);
  const inp=document.getElementById('ddBuscar'), res=document.getElementById('ddRes');
  const arrow=v=> v>0?`<span class="pill pv">+${fN(v)}</span>`: v<0?`<span class="pill pr">${fN(v)}</span>`:`<span class="pill pn">=</span>`;
  const filaP = p => `<tr><td>${p.nombre||'—'}<div style="color:var(--ink2);font-size:11px">DNI ${p.dni} · ${p.distrito||''}${p.vendedor?' · '+p.vendedor:''}</div></td>
    <td class="num">${fN(p.pre_ant)}</td><td class="num">${fN(p.pre_act)}</td><td class="num">${arrow(p.pre_dif)}</td>
    <td class="num">${fN(p.post_ant)}</td><td class="num">${fN(p.post_act)}</td><td class="num">${arrow(p.post_dif)}</td>
    <td class="num"><b>${fN(p.tot_ant)}</b></td><td class="num"><b>${fN(p.tot_act)}</b></td><td class="num">${arrow(p.tot_dif)}</td></tr>`;
  const pintar = q=>{
    q=(q||'').trim().toUpperCase();
    let lista = dd.puntos;
    if(q){ lista = lista.filter(p=> String(p.dni).toUpperCase().includes(q) || (p.nombre||'').toUpperCase().includes(q) || (p.distrito||'').toUpperCase().includes(q) || (p.vendedor||'').toUpperCase().includes(q)); }
    else { lista = lista.filter(p=> p.tot_ant!==0 || p.tot_act!==0); }
    lista = lista.slice().sort((a,b)=> b.tot_act - a.tot_act);
    if(!lista.length){ res.innerHTML = `<div class="card">Sin resultados.</div>`; return; }
    const top = lista.slice(0,200);
    res.innerHTML = `<div class="twrap"><table class="cmpTable">
      <thead><tr><th rowspan="2" style="text-align:left">Punto</th><th class="grpHead g-pre" colspan="3">Prepago</th><th class="grpHead g-post" colspan="3">Postpago</th><th class="grpHead g-tot" colspan="3">Total</th></tr>
      <tr><th class="b-start">${abAnt||'Ant.'}</th><th>${abAct||'Act.'}</th><th>Dif</th><th class="b-start">${abAnt||'Ant.'}</th><th>${abAct||'Act.'}</th><th>Dif</th><th class="b-start">${abAnt||'Ant.'}</th><th>${abAct||'Act.'}</th><th>Dif</th></tr></thead>
      <tbody>${top.map(filaP).join('')}</tbody></table></div>
      ${lista.length>200?`<p class="note">Mostrando 200 de ${fN(lista.length)}. Afina la búsqueda.</p>`:'<p class="note">Se muestran los puntos con movimiento (o todos si buscas algo). Ordenado por total actual.</p>'}`;
  };
  inp.oninput = e=> pintar(e.target.value);
  pintar('');
}

/* ================= ACTIVACIÓN POR VENDEDOR ================= */
function rPorVendedor(){
  const el = document.getElementById('tab-vendedor');
  const dd = DATA.diaadia;
  if(!dd || !dd.puntos || !dd.puntos.length){
    el.innerHTML = `<h2>Activación por vendedor</h2><div class="card">No se encontró la hoja <b>COMPARATIVO_DIA_A_DIA</b> en el archivo cargado.</div>`;
    return;
  }
  const abAnt = abrevMes(dd.mesAnterior), abAct = abrevMes(dd.mesActual);
  const byVend = new Map();
  dd.puntos.forEach(p=>{
    const v = (p.vendedor||'').trim() || '(Sin vendedor asignado)';
    if(!byVend.has(v)) byVend.set(v, {vendedor:v, pre_ant:0,pre_act:0,post_ant:0,post_act:0,tot_ant:0,tot_act:0, puntos:[]});
    const b = byVend.get(v);
    b.pre_ant+=p.pre_ant; b.pre_act+=p.pre_act; b.post_ant+=p.post_ant; b.post_act+=p.post_act; b.tot_ant+=p.tot_ant; b.tot_act+=p.tot_act;
    b.puntos.push(p);
  });
  const vends = [...byVend.values()];
  vends.forEach(v=>{
    v.dif = v.tot_act - v.tot_ant;
    v.falta = Math.max(0, v.tot_ant - v.tot_act);
    v.cap_ant = v.puntos.filter(p=>p.tot_ant>0).length;
    v.cap_act = v.puntos.filter(p=>p.tot_act>0).length;
    v.falta_cap = Math.max(0, v.cap_ant - v.cap_act);
    v.numClientes = v.puntos.length;
  });

  el.innerHTML = `
  <h2>Activación por vendedor <span class="tag">${dd.mesActual||''}${dd.diaCorte?' (al día '+dd.diaCorte+')':''}${dd.mesAnterior?' vs '+dd.mesAnterior+' (mismo día)':''}</span></h2>
  <div class="card" style="margin-bottom:14px">
    <label style="font-weight:600;display:block;margin-bottom:6px">Buscar vendedor</label>
    <input id="vBuscar" type="text" placeholder="Escribe para filtrar…" autocomplete="off"
      style="width:100%;max-width:440px;padding:11px 14px;border:1px solid #2c2e38;border-radius:10px;background:#1b1c22;color:#e8e8ea;font-size:15px;outline:none">
  </div>
  <div id="vRes"></div>`;

  const inp = document.getElementById('vBuscar'), res = document.getElementById('vRes');

  const pillFalta = falta => falta>0 ? `<span class="pill pr">Faltan ${fN(falta)}</span>` : `<span class="pill pv">✓ OK</span>`;
  const bloqueVendedor = (v,i) => {
    const idc = 'vc'+i;
    return `<div class="card" style="margin-bottom:12px">
      <div class="vHead" data-idc="${idc}" data-chart="chVend${i}" data-vend="${escAttr(v.vendedor)}" onclick="verVendedor(this)">
        <div>
          <div style="font-family:'Barlow Condensed';font-weight:700;font-size:19px">${v.vendedor}</div>
          <div style="color:var(--ink2);font-size:12px">${abAnt} → ${abAct}</div>
        </div>
        <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <div class="vStat">
            <div class="vStatLbl">Activación</div>
            <div class="vStatNum">${fN(v.tot_ant)} → ${fN(v.tot_act)}</div>
            ${pillFalta(v.falta)}
          </div>
          <div class="vStat vStatWide">
            <div class="vStatLbl">PDV (puntos de venta) · capilaridad</div>
            <div style="display:flex;gap:14px;justify-content:flex-end;align-items:flex-end">
              <div><div class="vMiniNum">${fN(v.numClientes)}</div><div class="vMiniLbl">Cartera</div></div>
              <div><div class="vMiniNum">${fN(v.cap_ant)}</div><div class="vMiniLbl">Atendió ${abAnt}</div></div>
              <div><div class="vMiniNum">${fN(v.cap_act)}</div><div class="vMiniLbl">Va ${abAct}</div></div>
              <div>${pillFalta(v.falta_cap)}</div>
            </div>
          </div>
          <span class="vChev" id="${idc}chev">▾</span>
        </div>
      </div>
      <div id="${idc}" class="vcbody">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:14px 0 10px">
          <h3 style="font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin:0">Clientes a su nombre</h3>

/* ================= drag & drop / parser SheetJS ================= */
const num = v => (typeof v==='number' && isFinite(v)) ? v : null;

function parseWB(wb){
  const out = { multimarca:null, multimarcaHistorico:[], comparativo:[], diaadia:null, corte:'' };
  /* Normaliza un DNI para poder cruzar hojas donde a veces viene como texto (con ceros a la
     izquierda) y otras como número — igual que hace VALUE() en las fórmulas del Excel. */
  const normDni = v => { const s=String(v==null?'':v).trim(); if(!s) return ''; const n=parseInt(s,10); return isNaN(n) ? s : String(n); };

  const cq = wb.Sheets['CUOTA_MES'];
  if(cq){
    const rows = XLSX.utils.sheet_to_json(cq,{header:1,raw:true,defval:null});
    const mesLbl = rows[1] && rows[1][2] ? String(rows[1][2]).trim() : '';
    const mm = {titulo: mesLbl ? ('Canal Multimarca — '+mesLbl) : 'Canal Multimarca', indicadores:[], distritos:[], total:null};
    const hdrI = rows.findIndex(r=>r && r[0]==='Indicador');
    if(hdrI>=0){
      let i=hdrI+1;
      while(i<rows.length && rows[i] && rows[i][0]){
        const r=rows[i];
        mm.indicadores.push({n:String(r[0]).trim(), cuota:num(r[1]), act:num(r[2]), proy:num(r[3])});
        i++;
      }
    }
    const hdrD = rows.findIndex(r=>r && r[0]==='Distrito' && r[1]==='Zona');
    if(hdrD>=0){
      let i=hdrD+1;
      while(i<rows.length && rows[i] && rows[i][0]){
        const r=rows[i];
        const rec = {
          d:String(r[0]).trim(), resp:r[2]?String(r[2]).trim():'',
          chips_pre:num(r[3]), ava_pre:num(r[4]), proy_pre:num(r[5]),
          chips_post:num(r[7]), ava_chip_post:num(r[8]), proy_post:num(r[9]),
          cap_pre:num(r[11]), ava_cap_pre:num(r[12]), proy_cap_pre:num(r[13]),
          cap_post:num(r[15]), ava_cap_post:num(r[16]), proy_cap_post:num(r[17])
        };
        if(String(r[0]).trim().toUpperCase()==='TOTAL'){ mm.total=rec; break; }
        mm.distritos.push(rec);
        i++;
      }
    }
    if(mm.indicadores.length || mm.distritos.length) out.multimarca = mm;
  }

  const hc = wb.Sheets['HISTORIAL_Y_CAPILARIDAD'];
  if(hc){
    const rows = XLSX.utils.sheet_to_json(hc,{header:1,raw:true,defval:null});
    const hdrI = rows.findIndex(r=>r && r[0]==='Mes (codigo)');
    const byMes = new Map();
    if(hdrI>=0){
      for(let i=hdrI+1;i<rows.length;i++){
        const r=rows[i]; if(!r || r[1]==null) continue;
        const mes = String(r[1]).trim();
        const distNom = r[2]?String(r[2]).trim():'';
        const rec = {venta_pre:num(r[3])||0, venta_post:num(r[4])||0, cap_pre:num(r[5])||0, cap_post:num(r[6])||0};
        if(!byMes.has(mes)) byMes.set(mes, {mes, distritos:[], total:null});
        const b = byMes.get(mes);
        if(distNom.toUpperCase()==='TOTAL'){ b.total = rec; } else { b.distritos.push({d:distNom, ...rec}); }
      }
    }
    out.multimarcaHistorico = [...byMes.values()].filter(b=> b.total && ((b.total.venta_pre||0)+(b.total.venta_post||0)+(b.total.cap_pre||0)+(b.total.cap_post||0) > 0));
  }

  const rc = wb.Sheets['REPORTE_POR_CLIENTE'];
  if(rc){
    const rows = XLSX.utils.sheet_to_json(rc,{header:1,raw:true,defval:null});
    out.corte = rows[1] && rows[1][0] ? String(rows[1][0]).trim() : '';
    const hdrI = rows.findIndex(r=>r && r[0]==='DNI');
    if(hdrI>=0){
      const hdrRow = rows[hdrI];
      const meses = [];
      for(let c=4;c<hdrRow.length;c+=2){
        if(hdrRow[c]) meses.push({mes:String(hdrRow[c]).trim(), colPre:c, colPost:c+1});
      }
      const activos = meses.filter(m=>{
        for(let i=hdrI+2;i<rows.length;i++){
          const r=rows[i]; if(!r||r[0]==null) continue;
          if((num(r[m.colPre])||0)!==0 || (num(r[m.colPost])||0)!==0) return true;
        }
        return false;
      });
      const out2=[];
      for(let i=hdrI+2;i<rows.length;i++){
        const r=rows[i]; if(!r || r[0]==null || r[0]==='') continue;
        out2.push({
          dni:String(r[0]).trim(), nombre:r[1]?String(r[1]).trim():'',
          distrito:r[2]?String(r[2]).trim():'', vendedor:r[3]?String(r[3]).trim():'',
          meses: activos.map(m=>({mes:m.mes, pre:num(r[m.colPre])||0, post:num(r[m.colPost])||0}))
        });
      }
      out.comparativo = out2;
    }
  }

  const cd = wb.Sheets['COMPARATIVO_DIA_A_DIA'] || wb.Sheets['COMP_DIA_X_DIA'];
  if(cd){
    const rows = XLSX.utils.sheet_to_json(cd,{header:1,raw:true,defval:null});
    const hdr2 = rows[1]||[];
    const mesActual = hdr2[1]?String(hdr2[1]).trim():'';
    const mesAnterior = hdr2[3]?String(hdr2[3]).trim():'';
    const diaCorte = num(hdr2[5]);
    const hdrI = rows.findIndex(r=>r && r[0]==='Distrito' && r[1]==='DNI');
    const puntos=[];
    if(hdrI>=0){
      for(let i=hdrI+2;i<rows.length;i++){
        const r=rows[i]; if(!r || r[1]==null) continue;
        puntos.push({
          distrito:r[0]?String(r[0]).trim():'', dni:normDni(r[1]),
          nombre:r[2]?String(r[2]).trim():'', direccion:r[3]?String(r[3]).trim():'',
          vendedor:r[4]?String(r[4]).trim():'',
          pre_ant:num(r[5])||0, pre_act:num(r[6])||0, pre_dif:num(r[7])||0,
          post_ant:num(r[9])||0, post_act:num(r[10])||0, post_dif:num(r[11])||0,
          tot_ant:num(r[13])||0, tot_act:num(r[14])||0, tot_dif:num(r[15])||0
        });
      }
    }
    out.diaadia = {mesActual, mesAnterior, diaCorte, puntos};
  }

  /* Ventas con fecha exacta (BASE) + mapeo DNI->Vendedor (MAESTRO_MM), para el detalle día a día.
     Se guarda compacto (solo fecha+dni, sin repetir el vendedor en cada fila) y filtrado a los
     dos meses que realmente se usan (mes actual y mes anterior), para no inflar el archivo. */
  out.ventasDiarias = [];
  out.vendMap = {};
  const mm2 = wb.Sheets['MAESTRO_MM'];
  if(mm2){
    const rows = XLSX.utils.sheet_to_json(mm2,{header:1,raw:true,defval:null});
    const hdrI = rows.findIndex(r=>r && String(r[0]||'').trim().toUpperCase()==='DNI');
    if(hdrI>=0){
      const hdrRow = rows[hdrI];
      const cDni = hdrRow.findIndex(c=>String(c||'').trim().toUpperCase()==='DNI');
      const cVend = hdrRow.findIndex(c=>String(c||'').trim().toUpperCase()==='VENDEDOR');
      for(let i=hdrI+1;i<rows.length;i++){
        const r=rows[i]; if(!r || r[cDni]==null || r[cDni]==='') continue;
        out.vendMap[normDni(r[cDni])] = (cVend>=0 && r[cVend]) ? String(r[cVend]).trim() : 'BLAZEL';
      }
    }
  }
  const codActFiltro = mesCodigo(out.diaadia && out.diaadia.mesActual);
  const codAntFiltro = mesCodigo(out.diaadia && out.diaadia.mesAnterior);
  const bs = wb.Sheets['BASE'];
  if(bs){
    const rows = XLSX.utils.sheet_to_json(bs,{header:1,raw:true,defval:null});
    const hdrI = rows.findIndex(r=>r && r.some(c=>String(c||'').trim().toUpperCase()==='FECHA_VENTA'));
    if(hdrI>=0){
      const hdrRow = rows[hdrI];
      const colOf = name => hdrRow.findIndex(c=>String(c||'').trim().toUpperCase()===name);
      const cFecha=colOf('FECHA_VENTA'), cDni=colOf('DNI_MULTIMARCA'), cModal=colOf('MODALIDAD_VENTA');
      const ventas=[];
      if(cFecha>=0){
        for(let i=hdrI+1;i<rows.length;i++){
          const r=rows[i]; if(!r) continue;
          const f = r[cFecha]; if(f==null || f==='') continue;
          let dstr;
          if(f instanceof Date){ dstr = f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0'); }
          else { const s=String(f).trim().replace(/-/g,'/'); const p=s.split('/'); if(p.length<3) continue; dstr = p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0'); }
          const cod = dstr.slice(0,7);
          if(cod!==codActFiltro && cod!==codAntFiltro) continue;
          const dni = cDni>=0 ? normDni(r[cDni]) : '';
          const m = cModal>=0 && String(r[cModal]||'').trim().toUpperCase().startsWith('POST') ? 2 : 1;
          ventas.push({f:dstr, d:dni, m});
        }
      }
      out.ventasDiarias = ventas;
    }
  }

  if(!out.multimarca && !out.comparativo.length && !out.multimarcaHistorico.length && !out.diaadia){
    throw 'No encuentro las hojas del CONTROL_MULTIMARCA_BLAZEL.xlsx (CUOTA_MES, REPORTE_POR_CLIENTE, HISTORIAL_Y_CAPILARIDAD, COMPARATIVO_DIA_A_DIA). ¿Es el archivo correcto?';
  }
  return out;
}

/* Intenta traer el Excel más reciente directo desde el mismo repositorio de GitHub (mismo
   nombre de archivo, subido junto al HTML con "Add file → Upload files"). Si el archivo todavía
   no existe ahí, o falla la descarga, seguimos tranquilamente con los datos ya cargados

/* ================= PLANES (HFC / Portabilidad / Alta Nueva / Alta Pre / Prepago Chip / Migración) =================
   Vive DENTRO de CONTROL_MULTIMARCA_BLAZEL.xlsx (el mismo Excel de arriba), en una
   pestaña adicional con columnas FECHA/ASESOR/CAMPAÑA/PLAN - CARGO FIJO — no hace
   falta un segundo archivo. Se lee del mismo workbook ya descargado por
   cargarExcelRemoto(), así que no se duplica la descarga del archivo grande. */
const LS_PLANES_KEY = 'blazel_mm_planes_data_v1';
let DATA_PLANES = null;
let planesMesSel = null;
const MESES_ES_PLANES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
const CATS_PLANES = [
  {clave:'FIJA', etiqueta:'HFC', chip:'ch-rojo'},
  {clave:'PORTABILIDAD', etiqueta:'Portabilidad', chip:'ch-negro'},
  {clave:'ALTA NUEVA', etiqueta:'Alta Nueva', chip:'ch-verde'},
  {clave:'ALTA PRE', etiqueta:'Alta Pre', chip:'ch-gris'},
  {clave:'PREPAGO CHIP', etiqueta:'Prepago Chip', chip:'ch-rojo'},
  {clave:'MIGRACIÓN', etiqueta:'Migración', chip:'ch-negro'},
];
const normVendPlanes = s => String(s||'').trim().replace(/\s+/g,' ').toUpperCase();
const MAPEO_VENDEDOR_PLANES = {
  'ALBERTO': 'ALBERTO ROJAS MENDOZA', 'ALBERTO ROJAS': 'ALBERTO ROJAS MENDOZA',
  'AMPARO': 'AMPARO SUAREZ ACEVEDO',
  'ANGELA': 'ANGELA ROJAS BOBBIO', 'ANGELA ROJAS': 'ANGELA ROJAS BOBBIO', 'ANGELAS ROJAS': 'ANGELA ROJAS BOBBIO',
  'FERNANDO': 'LUIS FERNANDO ROSADO', 'FERNANDO ROSADO': 'LUIS FERNANDO ROSADO',
  'JAVIER': 'JAVIER CASTELO JESÚS', 'JAVIER CASTELO': 'JAVIER CASTELO JESÚS',
  'JESUS': 'JESUS CRUZ ACUÑA', 'JESUS CRUZ': 'JESUS CRUZ ACUÑA',
  'RIGOBERTO': 'RIGOBERTO JUNIOR TERRANOVA GARCIA', 'RIGOBERTO TERRANOVA': 'RIGOBERTO JUNIOR TERRANOVA GARCIA',
  'MARIO': 'MARIO RAÚL GÁLVEZ MINAYA', 'MARIO GALVEZ': 'MARIO RAÚL GÁLVEZ MINAYA',
  'DANITZA': 'DANITZA MEYLEEN CARRILLO MEZA', 'DANITZA CARRILLO': 'DANITZA MEYLEEN CARRILLO MEZA',
  'GRACE': 'GRACIE ARACELI MANRIQUE MORQUENCHO', 'GRACIE': 'GRACIE ARACELI MANRIQUE MORQUENCHO',
  'CAMILO': 'CAMILO RIVERA',
};
/* La columna "PLAN - CARGO FIJO" viene sucia: a veces un número limpio (89),
   a veces texto con el precio al final ("MAX 29.90", "MAX NEGOCIOS + 55.90"),
   a veces "-" o vacío (prepago sin cargo fijo). Se intenta como número directo;
   si no, se prueba con el último "trozo" separado por espacios; si tampoco,
   se cuenta como 0. */
function cargoFijoNum(v){
  if(v==null) return 0;
  if(typeof v==='number' && isFinite(v)) return v;
  const s = String(v).trim();
  if(s==='' || s==='-') return 0;
  const directo = parseFloat(s.replace(',', '.'));
  if(!isNaN(directo) && /^-?\d+([.,]\d+)?$/.test(s)) return directo;
  const partes = s.split(/\s+/);
  const ultimo = partes[partes.length-1].replace(',', '.');
  const n = parseFloat(ultimo);
  return !isNaN(n) && /^-?\d+([.,]\d+)?$/.test(partes[partes.length-1]) ? n : 0;
}
/* Recorre TODAS las hojas del libro buscando una fila de encabezado con
   FECHA + ASESOR + CAMPAÑA (no importa el orden de columnas ni el nombre
   de la hoja) — así, si Julio agrega una hoja nueva cada mes, no hace
   falta tocar este código. Si además encuentra una columna de "cargo fijo"
   (el precio del plan), suma su monto por vendedor y mes en la clave _CF. */
function parsePlanesWB(wb){
  const porMes = {}; // 'Junio 2026' -> { vendedor: { CLAVE: cuenta, ..., _CF: monto } }
  const mesesSet = {};
  wb.SheetNames.forEach(function(sn){
    const sh = wb.Sheets[sn];
    if(!sh || !sh['!ref']) return;
    const range = XLSX.utils.decode_range(sh['!ref']);
    let headerRow = -1, cFecha=-1, cAsesor=-1, cCampana=-1, cCargoFijo=-1;
    for(let r=range.s.r; r<=Math.min(range.s.r+9, range.e.r); r++){
      let fFecha=-1, fAsesor=-1, fCampana=-1, fCargoFijo=-1;
      for(let c=range.s.c; c<=range.e.c; c++){
        const cell = sh[XLSX.utils.encode_cell({r:r,c:c})];
        const v = cell && cell.v!=null ? String(cell.v).trim().toUpperCase() : '';
        if(v==='FECHA') fFecha=c;
        else if(v==='ASESOR') fAsesor=c;
        else if(v==='CAMPAÑA' || v==='CAMPANA') fCampana=c;
        else if(v.indexOf('CARGO FIJO')>=0) fCargoFijo=c;
      }
      if(fFecha>=0 && fAsesor>=0 && fCampana>=0){ headerRow=r; cFecha=fFecha; cAsesor=fAsesor; cCampana=fCampana; cCargoFijo=fCargoFijo; break; }
    }
    if(headerRow<0) return;
    for(let r=headerRow+1; r<=range.e.r; r++){
      const fCell = sh[XLSX.utils.encode_cell({r:r,c:cFecha})];
      const aCell = sh[XLSX.utils.encode_cell({r:r,c:cAsesor})];
      const kCell = sh[XLSX.utils.encode_cell({r:r,c:cCampana})];
      const fv = fCell && fCell.v;
      if(!(fv instanceof Date) || isNaN(fv)) continue;
      const asesorRaw = aCell && aCell.v!=null ? normVendPlanes(aCell.v) : '';
      const campanaRaw = kCell && kCell.v!=null ? normVendPlanes(kCell.v) : '';
      if(!asesorRaw || !campanaRaw) continue;
      const asesor = MAPEO_VENDEDOR_PLANES[asesorRaw] || asesorRaw;
      const cat = CATS_PLANES.find(function(c){
        return normVendPlanes(c.clave)===campanaRaw
          || (c.clave==='MIGRACIÓN' && campanaRaw==='MIGRACION')
          || (c.clave==='ALTA NUEVA' && campanaRaw==='ALTA POST'); // Julio renombró "Alta Nueva" (postpago) a "Alta Post" en set-2026
      });
      const claveCat = cat ? cat.clave : 'OTROS';
      const mesLbl = MESES_ES_PLANES[fv.getUTCMonth()+1] + ' ' + fv.getUTCFullYear();
      mesesSet[mesLbl] = fv.getUTCFullYear()*100 + (fv.getUTCMonth()+1);
      if(!porMes[mesLbl]) porMes[mesLbl] = {};
      if(!porMes[mesLbl][asesor]) porMes[mesLbl][asesor] = {};
      porMes[mesLbl][asesor][claveCat] = (porMes[mesLbl][asesor][claveCat]||0) + 1;
      if(cCargoFijo>=0){
        const cfCell = sh[XLSX.utils.encode_cell({r:r,c:cCargoFijo})];
        const cfVal = cargoFijoNum(cfCell && cfCell.v);
        porMes[mesLbl][asesor]['_CF'] = (porMes[mesLbl][asesor]['_CF']||0) + cfVal;
      }
    }
  });
  const meses = Object.keys(mesesSet).sort(function(a,b){ return mesesSet[a]-mesesSet[b]; });
  return { porMes:porMes, meses:meses };
}

function rPlanes(){
  const el = document.getElementById('tab-planes');
  const P = DATA_PLANES;
  if(!P || !P.meses || !P.meses.length){
    el.innerHTML = `<h2>Planes <span class="tag">HFC, Portabilidad, Alta Nueva, Alta Pre, Prepago Chip, Migración</span></h2><div class="card">Todavía no encuentro una pestaña de Planes (con columnas FECHA/ASESOR/CAMPAÑA) dentro de ${escAttr(EXCEL_REMOTO)}.</div>`;
    return;
  }
  if(!planesMesSel || P.meses.indexOf(planesMesSel)<0) planesMesSel = P.meses[P.meses.length-1];
  const idxSel = P.meses.indexOf(planesMesSel);
  const mesAntLbl = idxSel>0 ? P.meses[idxSel-1] : null;
  const datosMes = P.porMes[planesMesSel] || {};
  const datosMesAnt = mesAntLbl ? (P.porMes[mesAntLbl] || {}) : {};

  const vendedores = Object.keys(datosMes);
  const totalesPorCat = {};
  CATS_PLANES.forEach(function(c){ totalesPorCat[c.clave] = 0; });
  let totalGeneral = 0;
  let cargoFijoGeneral = 0;
  vendedores.forEach(function(v){
    CATS_PLANES.forEach(function(c){ const n = datosMes[v][c.clave]||0; totalesPorCat[c.clave]+=n; totalGeneral+=n; });
    cargoFijoGeneral += datosMes[v]['_CF']||0;
  });
  const totalAntPorCat = {};
  CATS_PLANES.forEach(function(c){
    totalAntPorCat[c.clave] = Object.keys(datosMesAnt).reduce(function(s,v){ return s+(datosMesAnt[v][c.clave]||0); }, 0);
  });
  const fmtSoles = n => 'S/ '+n.toLocaleString('es-PE',{minimumFractionDigits:2, maximumFractionDigits:2});
  const totalGeneralAnt = mesAntLbl ? CATS_PLANES.reduce(function(s,c){ return s+(totalAntPorCat[c.clave]||0); }, 0) : null;
  const cargoFijoGeneralAnt = mesAntLbl ? Object.keys(datosMesAnt).reduce(function(s,v){ return s+(datosMesAnt[v]['_CF']||0); }, 0) : null;
  const difTotalGeneral = totalGeneralAnt!=null ? (totalGeneral-totalGeneralAnt) : null;
  const difCargoFijoGeneral = cargoFijoGeneralAnt!=null ? (cargoFijoGeneral-cargoFijoGeneralAnt) : null;

  const segHTML = `<div class="segRow" id="selPlanesMes">${P.meses.map(m=>`<button class="segBtn ${m===planesMesSel?'on':''}" data-m="${escAttr(m)}">${m}</button>`).join('')}</div>`;

  const kpiCard = c => {
    const n = totalesPorCat[c.clave]||0;
    const nAnt = totalAntPorCat[c.clave]||0;
    const dif = mesAntLbl ? (n-nAnt) : null;
    return `<div class="card kpi"><div class="chip ${c.chip}">${ICO.rayo}</div><div>
        <div class="lbl">${c.etiqueta}</div>
        <div class="val num">${fN(n)}</div>
        ${dif!=null ? `<div class="vs ${dif>0?'up':dif<0?'dn':'eq'}" style="${dif>0?'background:var(--verde-bg);color:var(--verde)':dif<0?'background:var(--rojo-bg);color:var(--rojo)':''}">${dif>0?'+':''}${dif} vs ${mesAntLbl}</div>` : ''}
      </div></div>`;
  };

  el.innerHTML = `
  <h2>Planes <span class="tag">HFC, Portabilidad, Alta Nueva, Alta Pre, Prepago Chip, Migración — por asesor y por mes</span></h2>
  <div class="card" style="margin-bottom:14px">${segHTML}</div>
  <div class="grid kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px">
    ${CATS_PLANES.map(kpiCard).join('')}
  </div>
  <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px">
    <div class="card kpi" style="display:flex;gap:14px;align-items:center">
      <div class="chip ch-rojo" style="width:52px;height:52px">${ICO.rayo}</div>
      <div>
        <div class="lbl">Total activaciones ${planesMesSel}</div>
        <div class="val num" style="font-size:34px">${fN(totalGeneral)}</div>
        ${difTotalGeneral!=null ? `<div class="vs ${difTotalGeneral>0?'up':difTotalGeneral<0?'dn':'eq'}" style="${difTotalGeneral>0?'background:var(--verde-bg);color:var(--verde)':difTotalGeneral<0?'background:var(--rojo-bg);color:var(--rojo)':''}">${difTotalGeneral>0?'+':''}${difTotalGeneral} vs ${mesAntLbl}</div>` : ''}
      </div>
    </div>
    <div class="card kpi" style="display:flex;gap:14px;align-items:center">
      <div class="chip ch-verde" style="width:52px;height:52px">${ICO.moneda}</div>
      <div>
        <div class="lbl">Cargo fijo total (CF) ${planesMesSel}</div>
        <div class="val num" style="font-size:34px">${fmtSoles(cargoFijoGeneral)}</div>
        ${difCargoFijoGeneral!=null ? `<div class="vs ${difCargoFijoGeneral>0?'up':difCargoFijoGeneral<0?'dn':'eq'}" style="${difCargoFijoGeneral>0?'background:var(--verde-bg);color:var(--verde)':difCargoFijoGeneral<0?'background:var(--rojo-bg);color:var(--rojo)':''}">${difCargoFijoGeneral>0?'+':difCargoFijoGeneral<0?'-':''}${fmtSoles(Math.abs(difCargoFijoGeneral))} vs ${mesAntLbl}</div>` : ''}
      </div>
    </div>
  </div>
  <h3 style="font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin:18px 0 10px">Por asesor</h3>
  <div id="planesVend"></div>
  <p class="note" style="margin-top:10px">Todavía no hay meta/cuota cargada para estos planes — se muestra el avance y la comparación contra el mes anterior. Ordenado de mayor a menor total.</p>`;

  document.querySelectorAll('#selPlanesMes .segBtn').forEach(function(b){
    b.onclick = function(){ planesMesSel = b.dataset.m; rPlanes(); };
  });

  const lista = vendedores.map(function(v){
    const d = datosMes[v];
    const dAnt = datosMesAnt[v] || {};
    const tot = CATS_PLANES.reduce(function(s,c){ return s+(d[c.clave]||0); }, 0) + (d['OTROS']||0);
    return { vendedor:v, d:d, dAnt:dAnt, tot:tot };
  }).sort(function(a,b){ return b.tot-a.tot; });

  const miniPillDif = (dif, esSoles) => {
    if(dif==null) return '';
    const cls = dif>0?'up':dif<0?'dn':'eq';
    const style = dif>0?'background:var(--verde-bg);color:var(--verde)':dif<0?'background:var(--rojo-bg);color:var(--rojo)':'';
    const txt = esSoles
      ? (dif>0?'+':dif<0?'-':'')+fmtSoles(Math.abs(dif))
      : (dif>0?'+':'')+dif;
    return `<div class="vs ${cls}" style="${style};margin-top:5px">${txt}</div>`;
  };
  const miniStat = (c,d,dAnt) => {
    const n = d[c.clave]||0, nAnt = dAnt[c.clave]||0;
    const dif = mesAntLbl ? (n-nAnt) : null;
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:9px 8px;background:var(--paper);text-align:center">
        <div class="vMiniNum" style="font-size:18px">${fN(n)}</div>
        <div class="vMiniLbl" style="font-size:10.5px;margin-top:2px">${c.etiqueta}</div>
        ${miniPillDif(dif,false)}
      </div>`;
  };
  const miniStatCF = (d,dAnt) => {
    const n = d['_CF']||0;
    const nAnt = dAnt ? (dAnt['_CF']||0) : 0;
    const dif = mesAntLbl ? (n-nAnt) : null;
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:9px 8px;background:var(--paper);text-align:center">
        <div class="vMiniNum" style="font-size:18px">${fmtSoles(n)}</div>
        <div class="vMiniLbl" style="font-size:10.5px;margin-top:2px">Cargo fijo (CF)</div>
        ${miniPillDif(dif,true)}
      </div>`;
  };
  const bloqueVend = (x,i) => {
    const idc = 'pv'+i;
    return `<div class="card" style="margin-bottom:12px">
      <div class="vHead" data-idc="${idc}" onclick="toggleDistrito(this)">
        <div>
          <div style="font-family:'Barlow Condensed';font-weight:700;font-size:19px">${x.vendedor}</div>
          <div style="color:var(--ink2);font-size:12px">${planesMesSel}</div>
        </div>
        <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <div class="vStat"><div class="vStatLbl">Total</div><div class="vStatNum">${fN(x.tot)}</div></div>
          <span class="vChev" id="${idc}chev">▾</span>
        </div>
      </div>
      <div id="${idc}" class="vcbody">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px">
          ${CATS_PLANES.map(c=>miniStat(c,x.d,x.dAnt)).join('')}
          ${miniStatCF(x.d,x.dAnt)}
        </div>
      </div>
    </div>`;
  };
  document.getElementById('planesVend').innerHTML = lista.length
    ? lista.map(bloqueVend).join('')
    : `<div class="card">Nadie tiene activaciones registradas en ${planesMesSel}.</div>`;
}

const EXCEL_REMOTO = 'CONTROL_MULTIMARCA_BLAZEL.xlsx';
function cargarExcelRemoto(){
  try{
    const savedP = localStorage.getItem(LS_PLANES_KEY);
    if(savedP){ const d = JSON.parse(savedP); if(d && d.meses){ DATA_PLANES = d; rPlanes(); } }
  }catch(e){}
  fetch(EXCEL_REMOTO + '?t=' + Date.now(), {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .then(buf => {
      const wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
      const parsed = parseWB(wb);
      DATA = parsed; usandoRemoto = true;
      try{
        localStorage.setItem(LS_KEY, JSON.stringify(DATA));
        localStorage.setItem(LS_META, JSON.stringify({archivo:EXCEL_REMOTO, fecha:new Date().toISOString()}));
      }catch(e){}
      DATA_PLANES = parsePlanesWB(wb);
      try{ localStorage.setItem(LS_PLANES_KEY, JSON.stringify(DATA_PLANES)); }catch(e){}
      renderAll();
      actualizarIndicador();
      rPlanes();
    })
    .catch(err => { console.log('Excel en línea no disponible todavía:', err); });
}

tabs();
renderAll();
actualizarIndicador();
cargarExcelRemoto();

/* ===== Login multimarca ===== */
const USUARIOS_MM = {
  jmaza:  { clave:'jmaza' },
  gracie: { clave:'gracie' },
  amparo: { clave:'amparo' }
};
let USUARIO_MM = null;
(function(){
  const ov=document.getElementById('loginOverlay'); if(!ov) return;
  const err=document.getElementById('lerr');
  function aplicar(u){
    USUARIO_MM=u;
    ov.style.display='none';
  }
  function entrar(){
    const u=document.getElementById('luser').value.trim().toLowerCase();
    const k=document.getElementById('lpass').value;
    const c=USUARIOS_MM[u];
    if(!c || c.clave!==k){ err.textContent='Usuario o clave incorrectos.'; document.getElementById('lpass').value=''; return; }
    try{ sessionStorage.setItem('mm_user',u); }catch(e){}
    aplicar(u);
  }
  document.getElementById('lbtn').onclick=entrar;
  document.getElementById('lpass').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
  document.getElementById('luser').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lpass').focus(); });
  try{
    const qs=new URLSearchParams(location.search);
    if(qs.get('embed')==='1'){
      const uu=(qs.get('u')||'').toLowerCase();
      if(USUARIOS_MM[uu]){ aplicar(uu); return; }
    }
  }catch(e){}
  try{ const su=sessionStorage.getItem('mm_user'); if(su && USUARIOS_MM[su]){ aplicar(su); return; } }catch(e){}
  document.getElementById('luser').focus();
})();
</script>
