<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro de Asistencia — Blazel</title>
<style>
  :root{
    --rojo: #E4002B;
    --rojo-oscuro: #A5001F;
    --tinta: #1B1B1F;
    --gris: #6B6B75;
    --gris-claro: #F1F1F4;
    --verde: #1E8E5A;
    --borde: #E3E3E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--gris-claro);
    color: var(--tinta);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 24px 16px 40px;
  }
  .marca{
    display:flex;
    align-items:baseline;
    gap:2px;
    margin-bottom:4px;
  }
  .marca .b{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  .marca .l{font-weight:800; font-size:18px; letter-spacing:-0.01em; color:var(--rojo);}
  .subtitulo{
    color:var(--gris);
    font-size:13px;
    margin-bottom:22px;
    text-align:center;
  }
  .reloj{
    font-variant-numeric: tabular-nums;
    font-size:15px;
    color:var(--gris);
    margin-bottom:18px;
    letter-spacing:0.02em;
  }
  .tarjeta{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:18px;
    padding:22px 20px;
    width:100%;
    max-width:400px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  label{
    display:block;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--gris);
    margin-bottom:8px;
  }
  select{
    width:100%;
    padding:14px 12px;
    font-size:16px;
    border:1.5px solid var(--borde);
    border-radius:12px;
    background:#fff;
    color:var(--tinta);
    margin-bottom:20px;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6B75' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position: right 12px center;
    background-size:18px;
  }
  .botones{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  button{
    border:none;
    border-radius:14px;
    padding:20px;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active{ transform: scale(0.97); }
  button:disabled{ opacity:0.5; cursor:default; transform:none; }
  #btnEntrada{ background: var(--rojo); color:#fff; }
  #btnSalida{ background: var(--tinta); color:#fff; }
  .icono{ font-size:20px; line-height:1; }
  .estado{
    margin-top:18px;
    padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    text-align:center;
    display:none;
  }
  .estado.ok{ display:block; background:#E9F7EF; color:var(--verde); }
  .estado.error{ display:block; background:#FDEAEA; color:var(--rojo-oscuro); }
  .estado.cargando{ display:block; background:var(--gris-claro); color:var(--gris); }
  .pie{
    margin-top:22px;
    font-size:11px;
    color:var(--gris);
    text-align:center;
    max-width:340px;
  }
</style>
</head>
<body>

  <div class="marca"><span class="b">JMD-GERENCIA</span><span class="l">•GPS</span></div>
  <div class="subtitulo">Registro de asistencia de campo</div>
  <div class="reloj" id="reloj">--:--:--</div>

  <div class="tarjeta">
    <label for="nombre">Tu nombre</label>
    <!--
      PARA AGREGAR UN ASESOR NUEVO (cuando lleguen a 20):
      Copia una línea como esta:  <option>NOMBRE DEL ASESOR</option>
      y pégala debajo de las demás, con el nombre EXACTAMENTE igual
      a como aparece en tu hoja DATOS. Luego avísame para que también
      lo agregue en el Apps Script (paso necesario para que su marca
      se escriba en la fila correcta).
    -->
    <select id="nombre">
      <option value="">Selecciona tu nombre…</option>
      <option>AMPARO SUAREZ ACEVEDO</option>
      <option>ANGELA ROJAS BOBBIO</option>
      <option>CAMILO RIVERA</option>
      <option>JESUS CRUZ ACUÑA</option>
      <option>ALBERTO ROJAS MENDOZA</option>
      <option>CECILIA PUNTAS SALCEDO</option>
      <option>GRACIE ARACELI MANRIQUE MORQUENCHO</option>
      <option>RUTH SARAI VERGARA SANCHEZ</option>
      <option>ANGELY JARITZA ALEGRÍA ZAMBRANO</option>
      <option>JAVIER CASTELO JESÚS</option>
      <option>BRENNA JOSSARY SALAS SHAPIAMA</option>
      <option>LUIS FERNANDO ROSADO</option>
      <option>RIGOBERTO JUNIOR TERRANOVA GARCIA</option>
    </select>

    <div class="botones">
      <button id="btnEntrada" onclick="marcar('ENTRADA')">
        <span class="icono">▶</span> MARCAR ENTRADA
      </button>
      <button id="btnSalida" onclick="marcar('SALIDA')">
        <span class="icono">■</span> MARCAR SALIDA
      </button>
    </div>

    <div class="estado" id="estado"></div>
  </div>

  <div class="pie">Al marcar, se envía tu ubicación GPS junto con la hora exacta. Necesitas tener el GPS del celular activado.</div>

<script>
  // ======================================================================
  // PEGA AQUÍ LA URL QUE TE DIO GOOGLE APPS SCRIPT AL IMPLEMENTAR
  // (termina en /exec)
  // ======================================================================
  const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw125n4ceKoQwUBq8zRHKeGzHue_EzZj8yd1zYt_xym0BUbiOgnr5rJFtLuapDJA3kfsA/exec";

  function actualizarReloj(){
    const ahora = new Date();
    document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-PE');
  }
  setInterval(actualizarReloj, 1000);
  actualizarReloj();

  function mostrarEstado(tipo, mensaje){
    const el = document.getElementById('estado');
    el.className = 'estado ' + tipo;
    el.textContent = mensaje;
  }

  function ponerBotones(activo){
    document.getElementById('btnEntrada').disabled = !activo;
    document.getElementById('btnSalida').disabled = !activo;
  }

  function marcar(tipo){
    const nombre = document.getElementById('nombre').value;
    if(!nombre){
      mostrarEstado('error', 'Primero selecciona tu nombre.');
      return;
    }
    if(URL_SCRIPT.indexOf('PEGAR_AQUI') !== -1){
      mostrarEstado('error', 'Falta configurar la URL del sistema. Avisa a Julio.');
      return;
    }
    if(!navigator.geolocation){
      mostrarEstado('error', 'Este celular no soporta ubicación GPS.');
      return;
    }

    mostrarEstado('cargando', 'Obteniendo tu ubicación…');
    ponerBotones(false);

    navigator.geolocation.getCurrentPosition(function(pos){
      const datos = {
        nombre: nombre,
        tipo: tipo,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };

      fetch(URL_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos)
      }).then(function(){
        const hora = new Date().toLocaleTimeString('es-PE');
        mostrarEstado('ok', (tipo === 'ENTRADA' ? 'Entrada' : 'Salida') + ' registrada — ' + hora);
        ponerBotones(true);
      }).catch(function(){
        mostrarEstado('error', 'No se pudo enviar. Revisa tu conexión e intenta de nuevo.');
        ponerBotones(true);
      });

    }, function(error){
      mostrarEstado('error', 'No se pudo obtener tu ubicación. Activa el GPS y vuelve a intentar.');
      ponerBotones(true);
    }, { enableHighAccuracy: true, timeout: 15000 });
  }
</script>

</body>
</html>
